<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gear 4 Oral Strip</title>
<meta name="description" content="Gear 4 — a Ganoderma oral strip for men that melts on the tongue. No water, sugar-free. By Rimba Botanicals.">
<meta name="theme-color" content="#12352B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F3;      /* cool off-white with a breath of green */
  --mist:#E4EAE3;       /* section bands, hairlines */
  --line:#D3DBD2;
  --rimba:#12352B;      /* deep forest green — primary */
  --rimba-2:#1E4A3C;
  --ink:#16211C;        /* text */
  --muted:#5A6A62;
  --gold:#A87C25;       /* brass, used sparingly */
  --gold-soft:#F1E6CB;
  --sale:#9A2F1F;       /* lingzhi lacquer — only for savings */
  --white:#FFFFFF;
  --wa:#1FA855;
  --r-lg:22px;--r-md:14px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;line-height:1.08;letter-spacing:-.01em;color:var(--rimba)}
h1{font-size:clamp(40px,7.4vw,74px)}
h2{font-size:clamp(30px,4.6vw,46px);max-width:18ch}
h3{font-size:22px;line-height:1.2}
p{max-width:62ch}
.lead{font-size:clamp(17px,2vw,19px);color:var(--muted)}
.label{font-size:14px;font-weight:600;color:var(--gold);margin-bottom:14px}
section{padding:88px 0}
.band{background:var(--mist)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;border:0;cursor:pointer;font:700 16px "Plus Jakarta Sans",sans-serif;text-decoration:none;background:var(--rimba);color:var(--white);transition:background .15s}
.btn:hover{background:var(--rimba-2)}
.btn.line{background:transparent;color:var(--rimba);box-shadow:inset 0 0 0 1.5px var(--rimba)}
.btn.line:hover{background:var(--white)}
.btn.wa{background:var(--wa)}
.btn.wa:hover{background:#18914a}
.btn.full{width:100%}

/* announcement + header */
.announce{background:var(--rimba);color:#DCE7E0;text-align:center;font-size:13.5px;font-weight:500;padding:9px 16px}
.announce b{color:var(--gold-soft)}
header{position:sticky;top:0;z-index:40;background:rgba(245,247,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;height:66px}
.logo{font-family:Gloock,serif;font-size:23px;color:var(--rimba);text-decoration:none;margin-right:auto;letter-spacing:.01em}
.logo small{font-family:"Plus Jakarta Sans";font-size:11px;font-weight:600;color:var(--gold);display:block;margin-top:-4px;letter-spacing:.02em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--white)}
.lang button{border:0;background:none;font:600 13px "Plus Jakarta Sans";color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--rimba);color:var(--white)}
.hdr-cta{min-height:42px;padding:0 18px;font-size:14px}

/* hero */
.hero{padding:56px 0 72px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{margin-bottom:22px}
.hero .lead{margin-bottom:30px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.assure{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:14px;color:var(--muted)}
.assure span::before{content:"✓";color:var(--gold);font-weight:700;margin-right:7px}
.offer{display:inline-block;background:var(--gold-soft);color:#6E4F10;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;margin-bottom:20px}
.stage{position:relative;aspect-ratio:1/1;max-width:520px;margin-left:auto;width:100%}
.stage .disc{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50% 45%,#FFFFFF 0%,#EAF0E9 62%,#DCE5DB 100%)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.strip-film{transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
  .strip-film{animation:rise 1.1s .35s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{transform:translateY(60px) rotate(0deg);opacity:0}to{transform:translateY(0) rotate(-6deg);opacity:1}}
}
@media (prefers-reduced-motion:reduce){.strip-film{transform:rotate(-6deg)}}

/* facts row */
.facts{border-block:1px solid var(--line);background:var(--white)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{padding:22px 18px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0}
.fact b{display:block;font-family:Gloock,serif;font-weight:400;font-size:26px;color:var(--rimba);line-height:1.1}
.fact span{font-size:14px;color:var(--muted)}

/* pain */
.pain .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.pain ul{list-style:none}
.pain li{padding:22px 0;border-top:1px solid var(--line)}
.pain li:last-child{border-bottom:1px solid var(--line)}
.pain li h3{font-size:21px;margin-bottom:4px}
.pain li p{color:var(--muted)}
.bridge{margin-top:26px;font-size:19px;font-weight:600;color:var(--rimba)}

/* benefits */
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:44px;background:var(--white);border-radius:var(--r-lg);border:1px solid var(--line)}
.benefit{padding:32px 28px;border-left:1px solid var(--line)}
.benefit:first-child{border-left:0}
.benefit svg{width:40px;height:40px;margin-bottom:18px}
.benefit p{color:var(--muted);font-size:15.5px;margin-top:6px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:44px;counter-reset:s}
.step{position:relative;padding-top:64px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;font-family:Gloock,serif;font-size:46px;line-height:1;color:var(--gold)}
.step p{color:var(--muted);margin-top:6px}
.limit{margin-top:34px;display:flex;gap:14px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;font-size:15px;color:var(--muted);max-width:720px}
.limit b{color:var(--ink)}

/* ingredients */
.ingr .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.ing-list{list-style:none;margin-top:34px}
.ing-list li{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.ing-list li:last-child{border-bottom:1px solid var(--line)}
.ing-list .role{font-size:13.5px;font-weight:600;color:var(--gold);padding-top:4px}
.ing-list h3{font-size:22px;margin-bottom:4px}
.ing-list p{color:var(--muted);font-size:15.5px}
.nut{background:var(--white);border:2px solid var(--rimba);border-radius:var(--r-md);padding:22px 22px 14px;position:sticky;top:96px}
.nut h3{font-size:20px;padding-bottom:10px;border-bottom:6px solid var(--rimba);margin-bottom:6px}
.nut table{width:100%;border-collapse:collapse;font-size:15px}
.nut td{padding:9px 0;border-bottom:1px solid var(--line)}
.nut tr:last-child td{border-bottom:0}
.nut td:last-child{text-align:right;font-weight:700}
.nut .note{font-size:13px;color:var(--muted);margin-top:8px}

/* compare */
.vs{width:100%;max-width:760px;margin-top:40px;border-collapse:separate;border-spacing:0;font-size:15.5px}
.vs th,.vs td{padding:16px 14px;text-align:left;border-bottom:1px solid var(--line)}
.vs thead th{font-family:Gloock,serif;font-weight:400;font-size:20px;color:var(--rimba)}
.vs thead th.us{background:var(--rimba);color:var(--white);border-radius:var(--r-md) var(--r-md) 0 0}
.vs td.us{background:var(--white);font-weight:700;color:var(--rimba);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.vs tr:last-child td.us{border-radius:0 0 var(--r-md) var(--r-md);border-bottom:1px solid var(--line)}
.vs td:first-child{color:var(--muted)}
.vs td.them{color:var(--muted)}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;align-items:stretch}
.plan{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 26px;display:flex;flex-direction:column;position:relative}
.plan.best{border:2px solid var(--rimba);box-shadow:0 18px 40px -22px rgba(18,53,43,.45)}
.tag{position:absolute;top:-14px;left:26px;background:var(--rimba);color:var(--white);font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}
.plan h3{font-size:24px}
.plan .qty{color:var(--muted);font-size:15px;margin:2px 0 18px}
.price{display:flex;align-items:baseline;gap:10px}
.price b{font-family:Gloock,serif;font-weight:400;font-size:52px;line-height:1;color:var(--rimba)}
.price s{color:var(--muted);font-size:17px}
.save{display:inline-block;margin:10px 0 18px;color:var(--sale);font-weight:700;font-size:14px}
.per{font-size:14px;color:var(--muted);margin:-10px 0 18px}
.plan ul{list-style:none;font-size:15px;color:var(--muted);margin-bottom:24px;flex:1}
.plan li{padding:6px 0 6px 26px;position:relative}
.plan li::before{content:"";position:absolute;left:0;top:13px;width:14px;height:8px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}

/* guarantee */
.guar{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;background:var(--rimba);color:#DCE7E0;border-radius:var(--r-lg);padding:40px}
.guar h2{color:var(--white);max-width:none;margin-bottom:10px}
.guar p{font-size:17px}
.guar a{color:var(--gold-soft)}
.seal{width:132px;height:132px}

/* reviews */
.reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.review{background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);padding:24px}
.review .stars{color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.review cite{display:block;margin-top:14px;font-style:normal;font-weight:700;font-size:14px;color:var(--rimba)}

/* faq */
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font-weight:700;font-size:17px;position:relative;color:var(--ink)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:6px;top:30px;width:10px;height:10px;border-right:2px solid var(--rimba);border-bottom:2px solid var(--rimba);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg);top:34px}
details p{color:var(--muted);padding:0 0 22px}

/* final */
.final{text-align:center;padding:96px 0}
.final h2{margin:0 auto 16px;max-width:16ch}
.final p{margin:0 auto 30px;color:var(--muted)}
.final .ctas{justify-content:center}

/* footer */
footer{background:var(--ink);color:#AEBBB4;padding:48px 0 120px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
footer .logo{color:var(--white);font-size:22px}
footer p{margin-top:12px;max-width:52ch}
footer nav{display:flex;flex-wrap:wrap;gap:10px 22px;align-content:flex-start}
footer nav a{color:var(--white);text-decoration:none;font-weight:600}
footer nav a:hover{text-decoration:underline}
footer .fine{grid-column:1/-1;border-top:1px solid #2C3A33;padding-top:20px;font-size:12.5px;line-height:1.7}

/* sticky mobile cta */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(245,247,243,.97);border-top:1px solid var(--line)}
.sticky .btn{flex:1;min-height:50px;padding:0 12px;font-size:15px}
.sticky .btn.wa{flex:0 0 auto;width:56px;padding:0}

.rm{font-size:14px;color:var(--muted);margin-top:6px}
.paywith{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:26px;font-size:14px;color:var(--muted)}
.paywith>span:first-child{margin-right:4px}
.chip{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.co-err{margin-top:14px;color:var(--sale);font-weight:600}
.btn-err{margin-top:10px;color:var(--sale);font-weight:600;font-size:14px;text-align:center}
.btn[aria-busy="true"]{opacity:.7;pointer-events:none}
.btn[aria-busy="true"]::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* order modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(22,33,28,.55);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--paper);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:26px 22px 22px;position:relative}
@media(min-width:640px){.ov{align-items:center}.modal{border-radius:var(--r-lg)}}
.modal h3{font-size:28px}
.modal .sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--mist);color:var(--ink);font-size:22px;cursor:pointer}
.fld{margin-top:16px}
.fld>label,.fld>.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;font:16px "Plus Jakarta Sans",sans-serif;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 12px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--rimba);border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.packs{display:grid;gap:8px}
.pk{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;font-size:15px}
.pk input{accent-color:var(--rimba);width:18px;height:18px}
.pk .pk-name{flex:1}
.pk b{font-family:Gloock,serif;font-weight:400;font-size:20px;color:var(--rimba)}
.pk.on{border-color:var(--rimba);background:#F0F5F1}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-weight:600}
.sum b{font-family:Gloock,serif;font-weight:400;font-size:30px;color:var(--rimba)}
.err{color:var(--sale);font-size:14px;margin-top:10px;display:none}
.pay{display:grid;gap:10px;margin-top:16px}
.note{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}

/* responsive */
@media(max-width:900px){
  .hero .wrap,.pain .wrap,.ingr .wrap,.faq .wrap,footer .wrap{grid-template-columns:1fr}
  .hero{padding-top:28px}
  .stage{max-width:380px;margin:0 auto;order:-1}
  .benefits{grid-template-columns:1fr}
  .benefit{border-left:0;border-top:1px solid var(--line)}
  .benefit:first-child{border-top:0}
  .steps,.plans,.reviews-grid{grid-template-columns:1fr}
  .plan.best{order:-1}
  .facts .wrap{grid-template-columns:1fr 1fr}
  .fact:nth-child(3){border-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .nut{position:static}
  .sticky{display:flex}
  .hdr-cta{display:none}
  section{padding:64px 0}
}
@media(max-width:560px){
  .guar{grid-template-columns:1fr;text-align:center;padding:30px 22px}
  .seal{margin:0 auto;width:110px;height:110px}
  .ing-list li{grid-template-columns:1fr;gap:4px}
  .vs{font-size:14px}.vs th,.vs td{padding:12px 8px}
  .vs thead th{font-size:17px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="announce" data-i="announce"></div>

<header>
  <div class="wrap">
    <a class="logo" href="#top" id="top">Gear 4<small>by Rimba Botanicals</small></a>
    <div class="lang" role="group" aria-label="Language">
      <button id="b-en" onclick="setLang('en')">EN</button>
      <button id="b-ms" onclick="setLang('ms')">BM</button>
    </div>
    <a href="#pricing" class="btn hdr-cta" data-i="cta_order"></a>
  </div>
</header>

<main>
<!-- HERO -->
<section class="hero">
  <div class="wrap">
    <div>
      <div class="offer" id="offer"><span data-i="offer"></span><span id="promo"></span></div>
      <h1 data-i="h_title"></h1>
      <p class="lead" data-i="h_lead"></p>
      <div class="ctas">
        <a href="#pricing" class="btn" data-i="cta_order"></a>
        <a href="#pricing" class="btn line" data-i="cta_prices"></a>
      </div>
      <div class="assure"><span data-i="as1"></span><span data-i="as2"></span><span data-i="as3"></span></div>
    </div>

    <!-- Replace this illustration with a real box photo when ready: <img src="box.jpg" alt="Gear 4 box"> -->
    <div class="stage" aria-hidden="true">
      <div class="disc"></div>
      <svg viewBox="0 0 500 500">
        <defs>
          <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8E6A1F"/><stop offset=".5" stop-color="#D9B35E"/><stop offset="1" stop-color="#8E6A1F"/></linearGradient>
          <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C98C3C" stop-opacity=".88"/><stop offset="1" stop-color="#8C4A1E" stop-opacity=".78"/></linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#12352B" flood-opacity=".22"/></filter>
        </defs>
        <!-- the strip, rising out of the box -->
        <g class="strip-film">
          <rect x="186" y="34" width="84" height="140" rx="8" fill="url(#film)"/>
          <rect x="193" y="41" width="70" height="126" rx="5" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/>
          <path d="M199 52 L216 50" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- box -->
        <g filter="url(#sh)">
          <polygon points="300,118 336,100 336,408 300,430" fill="#0E2A22"/>
          <polygon points="150,118 186,100 336,100 300,118" fill="#E9EFE8"/>
          <rect x="150" y="118" width="150" height="312" fill="#FFFFFF"/>
          <rect x="150" y="300" width="150" height="130" fill="#12352B"/>
          <path d="M150 300 Q225 276 300 300" fill="none" stroke="url(#g)" stroke-width="3"/>
          <text x="225" y="204" text-anchor="middle" font-family="Gloock,Georgia,serif" font-size="40" fill="#12352B">Gear</text>
          <text x="225" y="240" text-anchor="middle" font-family="Gloock,Georgia,serif" font-size="44" fill="url(#g)">4</text>
          <line x1="185" y1="252" x2="265" y2="252" stroke="#12352B" stroke-width="1"/>
          <text x="225" y="266" text-anchor="middle" font-family="Plus Jakarta Sans,Arial" font-size="9.5" font-weight="600" fill="#12352B">Oral strip · 2 strips</text>
          <text x="225" y="352" text-anchor="middle" font-family="Plus Jakarta Sans,Arial" font-size="9" fill="#C9D6CE">Ganoderma · Sugar-free</text>
          <text x="225" y="404" text-anchor="middle" font-family="Plus Jakarta Sans,Arial" font-size="7.5" fill="#8FA69A">RIMBA BOTANICALS</text>
        </g>

      </svg>
    </div>
  </div>
</section>

<!-- FACTS -->
<div class="facts">
  <div class="wrap">
    <div class="fact"><b data-i="f1b"></b><span data-i="f1"></span></div>
    <div class="fact"><b data-i="f2b"></b><span data-i="f2"></span></div>
    <div class="fact"><b>0 g</b><span data-i="f3"></span></div>
    <div class="fact"><b data-i="f4b"></b><span data-i="f4"></span></div>
  </div>
</div>

<!-- PAIN -->
<section class="pain">
  <div class="wrap">
    <div>
      <h2 data-i="pain_title"></h2>
      <p class="bridge" data-i="pain_bridge"></p>
    </div>
    <ul>

  track("InitiateCheckout", { content_name:"Gear 4", currency:"USD", value:PACKS[pack].usd, num_items:pack });
  try{
    const qs = new URLSearchParams(location.search);
    const utm = {};
    ["utm_source","utm_medium","utm_campaign","utm_content","fbclid","ttclid"].forEach(k => { if(qs.get(k)) utm[k] = qs.get(k).slice(0,120); });
    const r = await fetch("/api/checkout", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ pack, lang, utm }) });
    const j = await r.json();
    if(!r.ok || !j.url) throw new Error(j.error || "checkout");
    location.href = j.url;
  }catch(e){
    btn.removeAttribute("aria-busy");
    const note = document.createElement("p");
    note.className = "btn-err"; note.setAttribute("role","alert");
    note.textContent = T[lang].co_err;
    btn.insertAdjacentElement("afterend", note);
  }
}
document.querySelectorAll("[data-checkout]").forEach(b => b.addEventListener("click", () => goCheckout(b)));
window.addEventListener("pageshow", e => { if(e.persisted) document.querySelectorAll("[aria-busy]").forEach(b => b.removeAttribute("aria-busy")); });

/* ===== promo (real end date only) ===== */
function tickPromo(){
  const el = document.getElementById("promo");
  if(!PROMO_END){ el.textContent = ""; return; }
  const ms = new Date(PROMO_END) - new Date();
  if(ms <= 0){ document.getElementById("offer").style.display = "none"; return; }
  const dd = Math.floor(ms/864e5), hh = Math.floor(ms%864e5/36e5), mm = Math.floor(ms%36e5/6e4);
  el.textContent = ". " + T[lang].ends + (dd ? dd + (lang==="ms"?" hari ":"d ") : "") + hh + (lang==="ms"?" jam ":"h ") + mm + (lang==="ms"?" minit":"m");
}
setInterval(tickPromo, 30000);

/* ===== reviews (real only) ===== */
function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function renderReviews(){
  const sec = document.getElementById("reviews");
  if(!REVIEWS.length){ sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById("rvgrid").innerHTML = REVIEWS.map(r => '<figure class="review"><div class="stars" aria-label="'+(r.stars||5)+' stars">'+"★".repeat(r.stars||5)+'</div><blockquote>'+esc(lang==="ms"?(r.ms||r.en):(r.en||r.ms))+'</blockquote><cite>'+esc(r.name)+'</cite></figure>').join("");
}
